version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    groups:
      # Grouped so routine noise arrives as one PR — but restricted to
      # minor+patch ON PURPOSE. Without update-types, a major (a real
      # migration) rides into main inside a PR labelled like routine
      # maintenance. Majors are deliberately NOT ignored: they should arrive,
      # each as its own PR, so the migration is visible and reviewable.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

    # vitest majors are held back ON PURPOSE. @cloudflare/vitest-pool-workers
    # peers on `vitest@^4.1.0` and no published version of it accepts vitest 5
    # (checked every release through 0.22.0). A vitest 5 bump therefore cannot
    # install at all -- `npm ci` dies with ERESOLVE before a single test runs,
    # which takes CI *and* deploy.yml down together, since both start with
    # `npm ci`. That is exactly what happened on 2026-09-13.
    #
    # Remove this ignore only once vitest-pool-workers declares a peer range
    # that includes 5, and bump the two together in one PR:
    #   npm view @cloudflare/vitest-pool-workers peerDependencies.vitest
    ignore:
      - dependency-name: vitest
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      # github/codeql-action/{init,analyze} share one repository and one SHA.
      # Grouping them means they can only move as a set; a partial bump leaves
      # init and analyze on different versions and breaks every later PR.
      actions:
        patterns:
          - "*"

  # The toolchain image's bases (node:24-bookworm-slim, distroless
  # nodejs24-debian12). Note these must move TOGETHER and in step with
  # node-version in ci.yml/deploy.yml/release.yml -- Dependabot only sees the
  # Dockerfile, so it will propose a build-stage bump on its own. A major it
  # proposes is only mergeable if distroless publishes a matching runtime;
  # nodejs26-debian12 did not exist when node:26 was offered (see the closed
  # #28). Without this ecosystem the npm tree gets patched weekly while
  # the base image the release is built on quietly rots — and the base is the
  # part carrying the OS-level CVEs that `npm audit` cannot see.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    groups:
      docker-base-images:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
