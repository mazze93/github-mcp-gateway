name: Deploy

# Closes the gap that let production drift behind main: the Worker is deployed
# by hand from a workstation, so a merged fix stayed unshipped until someone
# remembered to run `wrangler deploy`. On 2026-08-03 the advisory fix in #5 sat
# merged-but-not-deployed for ~14 hours for exactly that reason.
#
# HISTORY: this file was structurally invalid from the commit that added it
# (2026-08-07) until 2026-08-19. The smoke test embedded a multi-line
# `python3 -c '...'` whose continuation lines sat at column 0, ending the
# `run: |` block scalar and promoting `try:` / `except Exception:` to
# top-level YAML keys. GitHub rejected the workflow at startup, so all 30
# runs "failed" with zero jobs and NOTHING was ever deployed by CI -- the
# exact manual-drift problem this workflow exists to close stayed open the
# whole time, silently. A workflow that fails at startup produces no job
# logs, which is why it read as noise rather than as a broken deploy.
#
# ci.yml does not catch this: it never parses deploy.yml. If this file is
# edited again, confirm the run actually produced jobs -- a red X with zero
# jobs is a different failure from a red X with a failed step.

# This is a SEPARATE workflow from ci.yml on purpose. ci.yml runs on every pull
# request, including from forks, and is deliberately credential-free — it builds
# with `--dry-run` so it *cannot* publish. This workflow is the only place a
# Cloudflare token exists, and it never runs on pull_request, so a fork PR can
# never reach the secret.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: deploying needs to read the repo and nothing else.
permissions:
  contents: read

# Never cancel a deploy in flight — an interrupted `wrangler deploy` leaves it
# ambiguous which version is live. Queue instead, so the last merge wins.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy to Cloudflare
    runs-on: ubuntu-latest

    # Named environment so branch/reviewer protection rules and the deployment
    # history are available from the repo settings without touching this file.
    environment:
      name: production
      url: ${{ vars.WORKER_BASE_URL || 'https://github-mcp-gateway.mazzewhiteley93.workers.dev' }}

    steps:
      # Third-party actions are pinned to a full commit SHA, never a mutable
      # tag — a tag can be repointed at arbitrary code after review.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install (locked)
        run: npm ci

      # The verification gate is repeated here rather than inherited from ci.yml.
      # A green CI run proves some commit was sound; it does not prove THIS tree
      # is. Re-running the checks in the same job that publishes means the exact
      # artifact being deployed is the one that passed.
      - name: Typecheck
        run: npm run typecheck

      - name: Audit production dependencies (must be zero)
        run: npm audit --omit=dev --audit-level=low

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # wrangler is invoked directly rather than via a third-party deploy
        # action: this step handles a credential, and the fewer external actions
        # in reach of it, the smaller the supply-chain surface.
        run: npx wrangler deploy

      # A deploy that returns success can still have shipped a broken gateway.
      # These are the same checks used to verify the OAuth fix by hand, so a
      # regression in the authorization path fails the workflow instead of
      # waiting to be discovered at the next login attempt.
      - name: Smoke-test the live gateway
        env:
          # A fork must smoke-test ITS OWN deployment. Set the repository
          # variable WORKER_BASE_URL (Settings > Secrets and variables >
          # Actions > Variables) to your Worker's URL; without it this falls
          # back to the upstream deployment, which would report a green deploy
          # based on somebody else's live Worker.
          BASE: ${{ vars.WORKER_BASE_URL || 'https://github-mcp-gateway.mazzewhiteley93.workers.dev' }}
        run: |
          set -euo pipefail
          fail=0
          Q="response_type=code&client_id=https%3A%2F%2Fclaude.ai%2Foauth%2Fclaude-code-client-metadata&code_challenge=abc&code_challenge_method=S256&state=xyz"

          check() { # name, want, got
            if [ "$2" = "$3" ]; then
              echo "PASS  $1 (got $3)"
            else
              echo "FAIL  $1 — wanted $2, got $3"
              fail=1
            fi
          }

          code() { curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 2 "$@"; }

          # The regression this repo was fixed for: a loopback callback on
          # localhost with an ephemeral port must reach the consent screen.
          check "localhost:<port> callback" 200 \
            "$(code "$BASE/authorize?$Q&redirect_uri=http%3A%2F%2Flocalhost%3A64341%2Fcallback")"

          # An untrusted redirect must be refused as a client error, not a 500.
          check "untrusted redirect rejected" 400 \
            "$(code "$BASE/authorize?$Q&redirect_uri=https%3A%2F%2Fevil.example%2Fcb")"

          # The MCP endpoint must never serve an unauthenticated caller.
          check "/mcp gates unauthenticated" 401 \
            "$(code -X POST "$BASE/mcp" -H 'Content-Type: application/json' -d '{}')"

          # Dynamic client registration must stay open for MCP clients.
          check "DCR /register" 201 \
            "$(code -X POST "$BASE/register" -H 'Content-Type: application/json' \
               -d '{"client_name":"ci-smoke","redirect_uris":["http://localhost:9/cb"],"token_endpoint_auth_method":"none"}')"

          # CIMD support is gated on the global_fetch_strictly_public compat
          # flag. If that flag is ever dropped this reports false and Claude
          # Code — which authenticates with a URL client_id — breaks entirely.
          # Parsed defensively with jq: if discovery returns non-JSON or drops
          # the key (a broken deploy, an error page), that surfaces as a plain
          # failed check rather than as noise that obscures the other results.
          #
          # jq, NOT an inline python heredoc. A multi-line `python3 -c '...'`
          # cannot live here: its continuation lines sit at column 0, which
          # ends the `run: |` block scalar and turns them into top-level YAML
          # keys. That made this entire workflow file invalid and every run
          # failed at startup with zero jobs -- see the comment at the top.
          # NOTE: `// "<key-absent>"` would be WRONG here -- jq's alternative
          # operator treats `false` as empty, so a genuine `false` would be
          # misreported as a missing key. Ask has() explicitly.
          cimd="$(curl -sS --retry 3 --retry-delay 2 \
            "$BASE/.well-known/oauth-authorization-server" \
            | jq -r 'if has("client_id_metadata_document_supported")
                     then .client_id_metadata_document_supported
                     else "<key-absent>" end' \
            || echo "<not-json>")"
          # Expected FALSE, deliberately. CIMD is gated on two conditions in
          # workers-oauth-provider:
          #
          #   client_id_metadata_document_supported:
          #     !!options.clientIdMetadataDocumentEnabled && hasGlobalFetchStrictlyPublic()
          #
          # wrangler.jsonc sets the compatibility flag, but src/index.ts does
          # NOT pass `clientIdMetadataDocumentEnabled`, so CIMD is off. Claude
          # Code reaches this server through Dynamic Client Registration
          # instead (the "DCR /register" check above), which is why nothing
          # visibly broke.
          #
          # This asserts the CURRENT state rather than an aspiration, so the
          # check is honest. If CIMD is deliberately enabled later, flip the
          # provider option and this expectation in the SAME commit.
          check "CIMD state matches config" false "$cimd"

          exit $fail
