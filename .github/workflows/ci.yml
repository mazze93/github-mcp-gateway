name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build, audit
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a full commit SHA, never a mutable
      # tag — a tag can be repointed at arbitrary code after review.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # `ci`, not `install`: it installs exactly the lockfile and fails if
      # package.json and the lockfile disagree. `npm install` would silently
      # resolve a different tree than the one that was reviewed.
      - name: Install (locked)
        run: npm ci

      # ci.yml never parses the OTHER workflow files, which is how deploy.yml
      # stayed structurally invalid from 2026-08-07 to 2026-08-19: an embedded
      # multi-line `python3 -c` ended its `run: |` block scalar early and
      # promoted `try:`/`except Exception:` to top-level YAML keys. GitHub
      # rejected it at startup, so every run failed with ZERO jobs and no logs
      # -- indistinguishable from noise, and nothing was deployed for 12 days.
      #
      # Plain PyYAML rather than a linter action: this handles no credential
      # and needs no third party in reach of the repo to catch the failure
      # mode that actually bit.
      - name: Validate workflow files parse
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          python3 - <<'PY'
          import pathlib, sys, yaml
          ALLOWED = {"name", "on", True, "permissions", "concurrency", "jobs",
                     "env", "defaults", "run-name"}
          failed = False
          for path in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              try:
                  doc = yaml.safe_load(path.read_text())
              except yaml.YAMLError as exc:
                  print(f"::error file={path}::not valid YAML: {exc}")
                  failed = True
                  continue
              stray = set(doc) - ALLOWED
              if stray:
                  # Almost always a block scalar that ended early -- shell or
                  # python continuation lines dedented back to column 0.
                  print(f"::error file={path}::stray top-level keys {sorted(map(str, stray))} "
                        f"-- a `run: |` block probably ends early")
                  failed = True
              elif not doc.get("jobs"):
                  print(f"::error file={path}::no jobs defined")
                  failed = True
              else:
                  print(f"ok  {path}  jobs={list(doc['jobs'])}")
          sys.exit(1 if failed else 0)
          PY
      - name: Typecheck
        run: npm run typecheck

      # Runs against the real Workers runtime via @cloudflare/vitest-pool-workers
      # (workerd, not a Node polyfill) -- covers the OAuth allowlist gate, CSRF
      # and signed-cookie handling, loopback redirect normalisation, token
      # refresh, and tool error wrapping. See test/*.test.ts.
      - name: Test
        run: npm test

      # The real build. Catches bundling/binding errors that tsc cannot see.
      # --dry-run builds and exits without touching the account, so this needs
      # no Cloudflare credentials and can never publish from CI.
      - name: Build (wrangler dry-run — never deploys)
        run: npx wrangler deploy --dry-run --outdir dist

      # Gate PRODUCTION dependencies at zero. --omit=dev is deliberate, not a
      # loophole: dev-only advisories most often trace to
      # undici <- miniflare <- wrangler, a devDependency chain that never
      # enters the deployed artifact — the Worker runs on the Workers
      # runtime, not miniflare. When miniflare pins a vulnerable undici
      # directly (as it did until 2026-08-07), package.json's `overrides`
      # forces the patched version instead of waiting on upstream; see the
      # `undici` entry there. Gating production packages on that chain would
      # otherwise either wedge CI whenever upstream lags a patch, or push
      # someone to --force the whole build toolchain for no production
      # benefit. Dev advisories are still reported below, unpinned to the
      # exit code.
      - name: Audit production dependencies (must be zero)
        run: npm audit --omit=dev --audit-level=low

      - name: Audit dev dependencies (report only)
        run: npm audit || true

      # Build the toolchain image on every PR, WITHOUT pushing. release.yml
      # only runs on a tag, so without this the Dockerfile would first be
      # exercised at release time -- the one moment a failure is most
      # expensive. amd64 only here; the multi-arch build stays in release.yml
      # where the QEMU emulation cost is paid once.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Build toolchain image (never pushes)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: github-mcp-gateway-toolchain:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the entrypoint actually resolves inside the distroless final
      # stage -- a Dockerfile that builds but cannot run wrangler is a
      # Dockerfile that fails at the worst possible moment.
      - name: Smoke-test the image entrypoint
        run: |
          # `wrangler --version` prints the bare version ("4.119.0") with no
          # product name, so assert on the shape rather than on a substring.
          VERSION="$(docker run --rm github-mcp-gateway-toolchain:ci --version | tr -d '\r')"
          echo "wrangler in image: ${VERSION}"
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Image entrypoint did not report a wrangler version (got: ${VERSION})"
            exit 1
          fi
          # And it must be the version the lockfile pins, or the image is not
          # the reproducible toolchain it claims to be.
          EXPECTED="$(node -p "require('./node_modules/wrangler/package.json').version")"
          if [ "$VERSION" != "$EXPECTED" ]; then
            echo "::error::Image wrangler ${VERSION} != lockfile wrangler ${EXPECTED}"
            exit 1
          fi

      # A non-root final stage is a hardening claim; assert it rather than
      # trusting the Dockerfile to stay that way.
      - name: Assert the image does not run as root
        run: |
          UID_IN_IMAGE="$(docker image inspect github-mcp-gateway-toolchain:ci --format '{{.Config.User}}')"
          echo "image USER: ${UID_IN_IMAGE}"
          if [ -z "$UID_IN_IMAGE" ] || [ "$UID_IN_IMAGE" = "root" ] || [ "$UID_IN_IMAGE" = "0" ] || [ "${UID_IN_IMAGE%%:*}" = "0" ]; then
            echo "::error::Toolchain image runs as root"
            exit 1
          fi
