name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, audit
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a full commit SHA, never a mutable
      # tag — a tag can be repointed at arbitrary code after review.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # `ci`, not `install`: it installs exactly the lockfile and fails if
      # package.json and the lockfile disagree. `npm install` would silently
      # resolve a different tree than the one that was reviewed.
      - name: Install (locked)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The real build. Catches bundling/binding errors that tsc cannot see.
      # --dry-run builds and exits without touching the account, so this needs
      # no Cloudflare credentials and can never publish from CI.
      - name: Build (wrangler dry-run — never deploys)
        run: npx wrangler deploy --dry-run --outdir dist

      # Gate PRODUCTION dependencies at zero. --omit=dev is deliberate, not a
      # loophole: the only advisories currently outstanding come from
      # undici <- miniflare <- wrangler, a devDependency that miniflare pins
      # EXACTLY and that never enters the deployed artifact — the Worker runs
      # on the Workers runtime, not miniflare. Gating on it would either wedge
      # CI permanently or push someone to --force the build toolchain for no
      # production benefit. Dev advisories are still reported below, unpinned
      # to the exit code.
      - name: Audit production dependencies (must be zero)
        run: npm audit --omit=dev --audit-level=low

      - name: Audit dev dependencies (report only)
        run: npm audit || true
